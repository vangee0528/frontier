name: Wheels

# 触发：打 tag 或手动。产出 manylinux / macOS / Windows wheel 并上传。
# 核心已无 __int128 依赖，MSVC 代码级可移植（Windows wheel 由 CI 首跑验证）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          # win32 跳过：llvmlite 无 32 位 wheel，该构型装不了运行时依赖
          CIBW_SKIP: "*-musllinux* *-win32"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          # 部署目标 11.0：llvmlite 的 macOS wheel 即 11.0+，更低目标会让
          # 测试环境的 pip 拒收其 wheel 而转从源码构建（需要完整 LLVM）
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=11.0"
          # 测试依赖保持最小集：scipy 适配器测试自动 importorskip，
          # 其完整覆盖由主 CI 的原生环境负责；容器内源码编 scipy 不现实
          CIBW_TEST_REQUIRES: pytest numpy sympy llvmlite
          CIBW_TEST_COMMAND: python -m pytest {project}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

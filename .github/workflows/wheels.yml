name: Wheels

# 触发：打 tag 或手动。产出 manylinux / macOS / Windows wheel 并上传。
# 核心已无 __int128 依赖，MSVC 代码级可移植（Windows wheel 由 CI 首跑验证）。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_TEST_REQUIRES: pytest numpy sympy scipy llvmlite
          CIBW_TEST_COMMAND: python -m pytest {project}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

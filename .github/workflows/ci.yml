name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-unix:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install "pybind11<3" llvmlite numpy sympy scipy pytest ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: python

  sanitizers:
    # ASan+UBSan 常驻：C++ 核心全部断言在消毒器下运行。
    # 刻意泄漏的单例（intern 表/常量）始终可达，LeakSanitizer 不计。
    name: asan+ubsan / gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Debug + sanitizers)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DFRONTIER_BUILD_PYTHON=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Run C++ tests under sanitizers
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1
          ./build/cpp/tests/frontier_tests

  test-windows-msvc:
    # MSVC 常驻验证（构建 + C++ 断言 + Python 全套）
    name: windows-msvc / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install "pybind11<3" llvmlite numpy sympy scipy pytest
      - name: Configure (MSVC)
        # 不固定生成器版本：runner 镜像的 VS 大版本会升级
        #（windows-latest 现已是 VS 18），让 CMake 自选最新 Visual Studio
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: python

  fuzz:
    # 差分模糊：固定种子批 + 结果 artifact。fuzzer 发现 BUG 类记录
    # 时退出码非零（类别定义唯一来源：tests/fuzz/fuzz_differential.py）
    name: differential-fuzz / py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "pybind11<3" llvmlite numpy sympy pytest ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Run fuzz batch (seed 1101, n 300)
        run: |
          PYTHONPATH=python python tests/fuzz/fuzz_differential.py \
            --seed 1101 --n 300 \
            --json-out fuzz-records.jsonl --json-summary fuzz-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-results-seed1101
          path: |
            fuzz-summary.json
            fuzz-records.jsonl
          if-no-files-found: ignore

  test-windows-mingw:
    # Windows 走 MinGW-w64（主开发平台，全量验证）。
    # 核心代码已无 __int128 依赖（checked_int.hpp 抽象），MSVC 可编译
    # 但未在 CI 常驻验证。
    name: windows-mingw / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          path-type: inherit
      - name: Install Python dependencies
        run: python -m pip install "pybind11<3" llvmlite numpy sympy scipy pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DPython_EXECUTABLE="$(python -c 'import sys;print(sys.executable)')"
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: PYTHONPATH=python python -m pytest tests -q

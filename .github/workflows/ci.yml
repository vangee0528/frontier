name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-unix:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install "pybind11<3" llvmlite numpy sympy scipy pytest ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: python -m pytest tests -q
        env:
          PYTHONPATH: python

  test-windows-mingw:
    # Windows 走 MinGW-w64（主开发平台，全量验证）。
    # 核心代码已无 __int128 依赖（checked_int.hpp 抽象），MSVC 可编译
    # 但未在 CI 常驻验证。
    name: windows-mingw / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          path-type: inherit
      - name: Install Python dependencies
        run: python -m pip install "pybind11<3" llvmlite numpy sympy scipy pytest
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DPython_EXECUTABLE="$(python -c 'import sys;print(sys.executable)')"
      - name: Build
        run: cmake --build build
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: PYTHONPATH=python python -m pytest tests -q
